<!doctype html>
<html lang="es">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Gastos de Viaje</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Gastos</h1>
    <button id="tabExpenses" class="tab active">Cargar</button>
    <button id="tabSummary" class="tab">Resumen</button>
    <button id="tabSettings" class="tab">Presupuesto</button>
  </header>

  <main class="container">
    <!-- CARGAR -->
    <section id="viewExpenses" class="view">
      <form id="expenseForm" class="card">
        <label>
          Categoría
          <select id="categorySelect" required>
  <option value="Café">Café</option>
  <option value="Supermercado">Supermercado</option>
  <option value="Restaurante">Restaurante</option>
  <option value="Transporte">Transporte</option>
  <option value="Taxi / Uber">Taxi / Uber</option>
  <option value="Propina">Propina</option>
  <option value="Farmacia">Farmacia</option>
  <option value="Compras">Compras</option>
  <option value="Entretenimiento">Entretenimiento</option>
  <option value="Otros">Otros</option>
  <option value="__new__">➕ Agregar nueva categoría…</option>
</select>

        </label>

        <label id="newCategoryWrap" style="display:none;">
          Nueva categoría
          <input id="newCategoryInput" type="text" placeholder="Ej: Café, Uber, Supermercado" autocomplete="off" />
        </label>

        <label>
          Monto
          <label>
  Moneda
  <select id="currencySelect" required>
  <option value="ARS" selected>ARS (Pesos)</option>
  <option value="USD">USD (Dólares)</option>
</select>

</label>

<label>
  Monto
  <input id="amountInput" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required />
</label>

<p class="muted" id="conversionHint" style="margin-top:-6px;">
  Tipo de cambio no configurado.
</p>

        </label>

        <button type="submit" class="primary">Agregar</button>
        <p class="muted">Tip: tocá dos veces un gasto para borrarlo.</p>
      </form>

      <div class="card">
        <div class="row">
          <strong>Recientes</strong>
          <button id="exportBtn" class="ghost">Exportar CSV</button>
        </div>
        <ul id="expenseList" class="list"></ul>
      </div>
    </section>

    <!-- RESUMEN -->
    <section id="viewSummary" class="view hidden">
      <div class="card">
        <h2>Total</h2>
        <div class="big" id="totalSpent">$0.00</div>

        <div class="progressWrap">
          <div class="progressLabel">
            <span>Progreso del presupuesto</span>
            <span id="budgetLabel">Sin presupuesto</span>
          </div>
          <div class="progressBar">
            <div id="progressFill" class="progressFill"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Por categoría</h2>
        <ul id="byCategory" class="list"></ul>
      </div>

      <div class="card">
        <h2>Por día</h2>
        <ul id="byDay" class="list"></ul>
      </div>
    </section>

    <!-- PRESUPUESTO -->
    <section id="viewSettings" class="view hidden">
      <div class="card">
        <h2>Presupuesto</h2>
<label>
  Tipo de cambio (ARS por 1 USD)
  <input id="fxRate" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Ej: 1200.00" />
</label>

        <label>
          Presupuesto total del viaje (opcional)
          <input id="tripBudget" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Ej: 800.00" />
        </label>

        <label>
          Presupuesto diario (opcional)
          <input id="dailyBudget" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Ej: 50.00" />
        </label>

        <button id="saveBudget" class="primary">Guardar</button>

        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0;" />

        <h2>Categorías</h2>
        <label>
          Agregar categoría
          <div class="row" style="align-items:stretch;">
            <input id="addCategoryInput" type="text" placeholder="Ej: Taxi, Propina, Farmacia" />
            <button id="addCategoryBtn" class="ghost" style="width:auto;">Agregar</button>
          </div>
        </label>

        <button id="resetCategories" class="ghost">Restablecer categorías</button>
        <button id="clearAll" class="danger">Borrar todo</button>

        <p class="muted">Todo queda guardado localmente en tu teléfono.</p>
      </div>
    </section>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</body>
</html>
